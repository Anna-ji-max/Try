name: Build FocusGuard APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Find Android project
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""
          PROJECT_DIR=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "./.git/*" -printf '%h\n' | head -n 1 || true)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" \
              -not -path "./.git/*" | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP file found."
              exit 1
            fi

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            PROJECT_DIR=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -printf '%h\n' | head -n 1 || true)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts"
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
